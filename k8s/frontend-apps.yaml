apiVersion: apps/v1
kind: Deployment
metadata:
  name: shell-app
  namespace: purplepay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shell-app
  template:
    metadata:
      labels:
        app: shell-app
    spec:
      containers:
        - name: shell-app
          image: purplepay/shell-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: shell-app
  namespace: purplepay
spec:
  selector:
    app: shell-app
  ports:
    - port: 3000
      targetPort: 3000
---
