apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: api-gateway-data
  namespace: purplepay
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: purplepay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: purplepay/api-gateway:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: backend-service-urls
          env:
            - name: DATABASE_PATH
              value: /app/data/gateway.db
          ports:
            - containerPort: 5000
          volumeMounts:
            - name: api-gateway-data
              mountPath: /app/data
      volumes:
        - name: api-gateway-data
          persistentVolumeClaim:
            claimName: api-gateway-data
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: purplepay
spec:
  selector:
    app: api-gateway
  ports:
    - port: 5000
      targetPort: 5000
---
